services:
- type: web
  name: chillonrails
  runtime: docker
  repo: https://github.com/kaxel/chillonrails
  plan: standard
  envVars:
  - key: DATABASE_URL
    sync: false
  - key: WEB_CONCURRENCY
    sync: false
  - key: RAILS_MASTER_KEY
    sync: false
  # Run Solid Queue inside Puma so background jobs (confirmation emails,
  # the pending-submission purge) actually process. Set value to "true".
  - key: SOLID_QUEUE_IN_PUMA
    sync: false
  # Stripe (song submission checkout) — set values in the Render dashboard.
  - key: STRIPE_SECRET_KEY
    sync: false
  - key: STRIPE_WEBHOOK_SECRET
    sync: false
  # Amazon S3 (Active Storage for uploaded audio) — set values in the dashboard.
  - key: AWS_ACCESS_KEY_ID
    sync: false
  - key: AWS_SECRET_ACCESS_KEY
    sync: false
  - key: AWS_REGION
    sync: false
  - key: AWS_S3_BUCKET
    sync: false
  region: oregon
  preDeployCommand: bin/rails db:migrate
  dockerContext: .
  dockerfilePath: ./Dockerfile
  domains:
  - www.chillfiltr.com
  - chillfiltr.com
  autoDeployTrigger: "off"
